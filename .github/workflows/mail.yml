name: E-Mail-Benachrichtigung
on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch:
    inputs:
      test:
        description: "Testmail mit aktuellem Stand senden"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lager prüfen und ggf. mailen
        run: node tools/mail-check.mjs
        env:
          TEST: ${{ github.event.inputs.test }}
      # GitHub pausiert geplante Abläufe nach 60 Tagen ohne Änderung im Repo.
      # Deshalb einmal im Monat ein kleiner Eintrag, damit es dauerhaft weiterläuft.
      - name: Am Leben halten
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0103" ]; then
            date -u > tools/keepalive.txt
            git config user.name "San-Lager"
            git config user.email "noreply@github.com"
            git add tools/keepalive.txt && git commit -m "keepalive" && git push
          fi
