function stock(){

  const add=(l,i,d)=>{(s[l]||(s[l]={}))[i]=((s[l]||{})[i]||0)+d};

  const skip=new Set((BASE&&BASE.incl)||[]);
  for(const b of BOOK){if(skip.has(b.id))continue;for(const x of b.lines||[])add(x.l,x.i,x.d)}
  return s;
}
function bagLines(bid){ // je Artikel Soll, sortiert nach Kategorie der ersten Fundstelle
  const b=CFG.bags[bid],t=b&&CFG.types[b.t];if(!t)return [];
  const secs=t.sec.map((s,k)=>({...s,k})).sort((a,b)=>CORD.indexOf(a.c)-CORD.indexOf(b.c)||a.k-b.k);
  const m={},out=[];
  for(const s of secs)for(const l of s.l){
    if(!CFG.items[l.i])continue;
    if(!m[l.i]){m[l.i]={i:l.i,soll:0,c:s.c,sec:s.n,parts:[]};out.push(m[l.i])}
    m[l.i].soll+=l.s;m[l.i].parts.push(s.n+" "+l.s);
  }
  return out;
}
function itemsSorted(){return Object.keys(CFG.items).sort((a,b)=>{const A=CFG.items[a],B=CFG.items[b];return CORD.indexOf(A.c)-CORD.indexOf(B.c)||A.n.localeCompare(B.n,"de")||(A.d||"").localeCompare(B.d||"","de",{numeric:true})})}

function consumption(){ // {item:{ym:n}}
  const c={};const add=(i,ym,n)=>{(c[i]||(c[i]={}))[ym]=((c[i]||{})[ym]||0)+n};

function fmtYm(ym){return MON[+ym.slice(5)-1]+" "+ym.slice(0,4)}
function chartSvg(m){
  const W=360,H=170,L=30,B=22,T=10,max=Math.max(1,...m),step=niceStep(max),top=Math.ceil(max/step)*step,bw=(W-L-6)/12;
  const y=v=>T+(H-T-B)*(1-v/top);let g="";
  const sc={0:"var(--blau)",1:"var(--blau)",11:"var(--blau)",5:"var(--warn)",6:"var(--warn)",7:"var(--warn)",2:"var(--ok)",3:"var(--ok)",4:"var(--ok)",8:"var(--rot)",9:"var(--rot)",10:"var(--rot)"};
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--mute)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  m.forEach((v,k)=>{const x=L+k*bw+3,h=(H-T-B)-(y(v)-T);g+=`<rect x="${x}" y="${y(v)}" width="${bw-6}" height="${Math.max(0,h)}" rx="2" fill="${sc[k]}" opacity="${v?0.9:0}"/><text x="${x+(bw-6)/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mute)">${MON[k]}</text>${v?`<text x="${x+(bw-6)/2}" y="${y(v)-3}" text-anchor="middle" font-size="9" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${v}</text>`:""}`});
  const leg=[["Winter","var(--blau)"],["Frühling","var(--ok)"],["Sommer","var(--warn)"],["Herbst","var(--rot)"]].map((s,k)=>`<rect x="${L+k*78}" y="${H+8}" width="10" height="10" rx="2" fill="${s[1]}"/><text x="${L+k*78+14}" y="${H+17}" font-size="11" fill="var(--ink)">${s[0]}</text>`).join("");
  return`<svg viewBox="0 0 ${W} ${H+26}" role="img" aria-label="Verbrauch je Monat">${g}${leg}</svg>`;
}
function niceStep(max){const r=max/4,p=Math.pow(10,Math.floor(Math.log10(r)));for(const f of [1,2,5,10])if(f*p>=r)return Math.max(1,f*p);return Math.max(1,p*10)}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;inv=null;edit=null;render();scrollTo(0,0);return}
  const a=t.dataset.act,S=()=>stock();
  if(t.tagName==="SELECT")return;
  if(a==="openbag"){bagSel=t.dataset.b;tab="bags";render();scrollTo(0,0)}
  else if(a==="selbag"){bagSel=t.dataset.b;inv=null;render()}
  else if(a==="sheet")openSheet(t.dataset.l,t.dataset.i);
  else if(a==="close"||(t.id==="sheet")){sheet=null;drawSheet()}
  else if(a==="sloc"){sheet.l=t.dataset.l;drawSheet()}
  else if(a==="qm"||a==="qp"){sheet.q=Math.max(1,(parseInt($("#sq").value)||1)+(a==="qp"?1:-1));$("#sq").value=sheet.q}
  else if(a==="qfill"){const st=S(),so=(bagLines(sheet.l).find(x=>x.i===sheet.i)||{}).soll||0;sheet.q=Math.max(1,so-((st[sheet.l]||{})[sheet.i]||0));$("#sq").value=sheet.q}
  else if(a==="book"){t.disabled=true;await book(t.dataset.k);t.disabled=false}
  else if(a==="fillall"){const st=S(),lines=[];for(const x of bagLines(bagSel)){const need=x.soll-((st[bagSel]||{})[x.i]||0),av=Math.max(0,st.lager[x.i]||0),q=Math.min(need,av);if(q>0)lines.push({i:x.i,l:"lager",d:-q},{i:x.i,l:bagSel,d:q})}
    if(!lines.length){toast("Im Lager ist nichts davon vorrätig");return}
    t.disabled=true;if(await write({kind:"auffuellen",lines,who:ls("who")||""}))toast(`${lines.length/2} Artikel aufgefüllt`);t.disabled=false}
  else if(a==="invstart"){inv={l:t.dataset.l,v:{}};render()}
  else if(a==="invcancel"){inv=null;render()}
  else if(a==="invsave"){const st=S(),lines=[];document.querySelectorAll("[data-inv]").forEach(x=>{const i=x.dataset.inv,v=parseInt(x.value);if(isNaN(v))return;const d=v-((st[inv.l]||{})[i]||0);if(d)lines.push({i,l:inv.l,d})});
    if(!lines.length){inv=null;render();toast("Keine Abweichungen");return}
    if(await write({kind:"inventur",lines,who:ls("who")||""})){toast(`Inventur gebucht: ${lines.length} Abweichungen`);inv=null;render()}}
  else if(a==="storno"){if(t.dataset.sure){try{await fb("/bookings/"+t.dataset.id,"DELETE");toast("Buchung storniert")}catch(err){toast("Storno nicht möglich")}}else{t.dataset.sure=1;t.textContent="Wirklich?"}}
  else if(a==="additem"){const n=$("#na-n").value.trim();if(!n){toast("Bitte eine Bezeichnung eingeben");return}
    const id=newId("a",CFG.items),c=$("#na-c").value;CFG.items[id]={n,d:$("#na-d").value.trim(),u:$("#na-u").value,c,min:parseInt($("#na-min").value)||0};
    const tt=$("#na-t").value,so=parseInt($("#na-soll").value)||0;
    if(tt&&so>0){const T=CFG.types[tt];let s=$("#na-s").value!==""?T.sec[+$("#na-s").value]:T.sec.find(x=>x.c===c);if(!s){s={n:CATS[c],c,l:[]};T.sec.push(s)}s.l.push({i:id,s:so})}
    if(await saveCfg(`„${n}“ angelegt`))render()}
  else if(a==="delitem"){if(t.dataset.sure){const i=t.dataset.i;delete CFG.items[i];for(const T of Object.values(CFG.types))for(const s of T.sec)s.l=s.l.filter(l=>l.i!==i);await saveCfg("Artikel gelöscht");render()}else{t.dataset.sure=1;t.textContent="Wirklich?"}}
  else if(a==="seltype"){editType=t.dataset.t;render()}
  else if(a==="delline"){CFG.types[editType].sec[+t.dataset.k].l.splice(+t.dataset.j,1);await saveCfg("Entfernt");render()}
  else if(a==="addline"){const k=+t.dataset.k,i=$("#al-"+k).value,s=parseInt($("#as-"+k).value)||1;if(!i)return;CFG.types[editType].sec[k].l.push({i,s});await saveCfg("Hinzugefügt");render()}
  else if(a==="addbag"){const n=$("#nb-n").value.trim();if(!n){toast("Bitte einen Namen eingeben");return}const id=newId("b",CFG.bags);CFG.bags[id]={n,t:$("#nb-t").value};await saveCfg(`${n} angelegt`);render()}
  else if(a==="delbag"){if(t.dataset.sure){delete CFG.bags[t.dataset.b];await saveCfg("Rucksack gelöscht");render()}else{t.dataset.sure=1;t.textContent="Wirklich?"}}
  else if(a==="setpin"){const p=$("#newpin").value.trim();if(p.length<4){toast("PIN braucht mindestens 4 Zeichen");return}CFG.pin=await sha(p);unlocked=true;try{sessionStorage.setItem("sl-unl",CFG.pin)}catch(e){}await saveCfg("PIN gespeichert");render()}
  else if(a==="unlock"){const h=await sha($("#pin").value.trim());if(h===CFG.pin){unlocked=true;try{sessionStorage.setItem("sl-unl",h)}catch(e){}render()}else toast("PIN falsch")}
  else if(a==="labdl")saveLabels();
  else if(a==="editon"){edit=t.dataset.m;inv=null;render()}
  else if(a==="editoff"){edit=null;render()}
  else if(a==="lstep"){const T=CFG.types[CFG.bags[bagSel].t],l=T.sec[+t.dataset.k].l[+t.dataset.j];l.s=Math.max(0,l.s+ +t.dataset.d);saveSoon();render()}
  else if(a==="ldel"){CFG.types[CFG.bags[bagSel].t].sec[+t.dataset.k].l.splice(+t.dataset.j,1);saveSoon();render()}
  else if(a==="ladd"){const k=+t.dataset.k,T=CFG.types[CFG.bags[bagSel].t],inp=$("#la-"+k),id=findOrCreate(inp.value,T.sec[k].c);if(!id)return;const ex=T.sec[k].l.find(l=>l.i===id);if(ex)ex.s++;else T.sec[k].l.push({i:id,s:1});saveSoon();render()}
  else if(a==="secdel"){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Fach löschen?";return}CFG.types[CFG.bags[bagSel].t].sec.splice(+t.dataset.k,1);saveSoon();render()}
  else if(a==="addsec"&&edit==="bag"){const n=$("#nf-n").value.trim();if(!n)return;CFG.types[CFG.bags[bagSel].t].sec.push({n,c:$("#nf-c").value,l:[]});saveSoon();render()}
  else if(a==="bagcol"){CFG.types[CFG.bags[bagSel].t].col=t.dataset.c;saveSoon();render()}
  else if(a==="bagown"){const b=CFG.bags[bagSel],id=newId("t",CFG.types);CFG.types[id]=JSON.parse(JSON.stringify(CFG.types[b.t]));CFG.types[id].n=b.n;b.t=id;saveSoon();toast("Eigene Bestückung angelegt");render()}
  else if(a==="bagdup"){const b=CFG.bags[bagSel],id=newId("b",CFG.bags),tid=newId("t",CFG.types);CFG.types[tid]=JSON.parse(JSON.stringify(CFG.types[b.t]));CFG.types[tid].n=b.n+" (Kopie)";CFG.bags[id]={n:b.n+" (Kopie)",t:tid};bagSel=id;saveSoon();toast("Rucksack dupliziert");render()}
  else if(a==="bagnew"){const id=newId("b",CFG.bags),tid=newId("t",CFG.types);CFG.types[tid]={n:"Neuer Rucksack",col:"rot",sec:[{n:"Hygiene",c:"H",l:[]}]};CFG.bags[id]={n:"Neuer Rucksack",t:tid};bagSel=id;edit="bag";tab="bags";saveSoon();render()}
  else if(a==="bagdel"){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Rucksack löschen?";return}delete CFG.bags[bagSel];bagSel=null;edit=null;saveSoon();toast("Rucksack gelöscht");render()}
  else if(a==="minstep"){const it=CFG.items[t.dataset.i];it.min=Math.max(0,(it.min||0)+ +t.dataset.d);saveSoon();render()}
  else if(a==="itemdel"){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Löschen?";return}const i=t.dataset.i;delete CFG.items[i];for(const T of Object.values(CFG.types))for(const sc of T.sec)sc.l=sc.l.filter(l=>l.i!==i);saveSoon();render()}
  else if(a==="itemnew"){const n=$("#ni-n").value.trim();if(!n){toast("Bitte eine Bezeichnung eingeben");return}const id=newId("a",CFG.items);CFG.items[id]={n,d:$("#ni-d").value.trim(),u:$("#ni-u").value,c:$("#ni-c").value,min:0};saveSoon();toast(`„${n}“ angelegt`);render()}
  else if(a==="compact")compact(t);
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="statsel"){statItem=t.value;render()}
  else if(t.id==="labsel"){labLoc=t.value;drawLabels()}
  else if(t.id==="na-t"){const T=CFG.types[t.value];$("#na-s").innerHTML='<option value="">automatisch nach Kategorie</option>'+(T?T.sec.map((s,k)=>`<option value="${k}">${CLET[s.c]} · ${esc(s.n)}</option>`).join(""):"")}
  else if(t.id==="eb-name"){CFG.bags[bagSel].n=t.value.trim()||CFG.bags[bagSel].n;saveSoon();render()}
  else if(t.id==="eb-type"){CFG.bags[bagSel].t=t.value;saveSoon();render()}
  else if(t.dataset.secname!==undefined){const sc=CFG.types[CFG.bags[bagSel].t].sec[+t.dataset.secname];sc.n=t.value.trim()||sc.n;saveSoon()}
  else if(t.dataset.seccat!==undefined){CFG.types[CFG.bags[bagSel].t].sec[+t.dataset.seccat].c=t.value;saveSoon();render()}
  else if(t.dataset.it){const it=CFG.items[t.dataset.it];it[t.dataset.f]=t.value.trim();saveSoon();if(t.dataset.f==="c")render()}
  else if(t.dataset.ed){const it=CFG.items[t.dataset.ed],f=t.dataset.f;it[f]=f==="min"?(parseInt(t.value)||0):t.value.trim();await saveCfg("Gespeichert")}
  else if(t.dataset.soll!==undefined){CFG.types[editType].sec[+t.dataset.soll].l[+t.dataset.j].s=Math.max(0,parseInt(t.value)||0);await saveCfg("Soll gespeichert")}
  else if(t.dataset.bag){CFG.bags[t.dataset.bag].n=t.value.trim()||CFG.bags[t.dataset.bag].n;await saveCfg("Gespeichert")}
});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.id&&t.id.startsWith("la-")){e.preventDefault();document.querySelector(`[data-act=ladd][data-k="${t.id.slice(3)}"]`).click()}});
document.addEventListener("toggle",e=>{const d=e.target;if(!d.id)return;if(d.open)OPEN.add(d.id);else OPEN.delete(d.id);if(d.id==="labdet"){ls("labopen",d.open?"1":"");drawLabels()}},true);
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet"){sheet=null;drawSheet()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;drawSheet()}});

/* ---------- Etiketten-Datei ---------- */
function saveLabels(){
  if(!window.QRCode){toast("QR-Bibliothek nicht geladen");return}
  const cells=[];for(const i of labelItems()){const it=CFG.items[i],tmp=document.createElement("div");new QRCode(tmp,{text:qrUrl(labLoc,i),width:300,height:300,correctLevel:QRCode.CorrectLevel.M});const c=tmp.querySelector("canvas");
    cells.push(`<div class="l"><img src="${c.toDataURL()}" alt=""><b>${esc(it.n)}</b><span>${esc(it.d)}</span><small>${esc(locName(labLoc))} · ${CLET[it.c]} ${CATS[it.c]}</small></div>`)}
  $("#print").innerHTML=`<div class="g">${cells.join("")}</div>`;setTimeout(()=>window.print(),150);
}

/* ---------- Zusammenfassen ---------- */
async function compact(btn){
  if(!btn.dataset.sure){btn.dataset.sure=1;btn.textContent="Wirklich zusammenfassen?";return}
  btn.disabled=true;
  try{
    const st=stock(),p={base:{stock:st,at:Date.now()}},add={};
    for(const b of BOOK){p["bookings/"+b.id]=null;if(b.kind!=="verbrauch")continue;const d=new Date(b.ts),ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");for(const x of b.lines)if(x.d<0){(add[ym]||(add[ym]={}))[x.i]=((add[ym]||{})[x.i]||0)-x.d}}
    for(const ym in add){const c={...((STATS[ym]||{}).c||{})};for(const i in add[ym])c[i]=(c[i]||0)+add[ym][i];p["stats/"+ym]={c}}
    await fb("","PATCH",p);toast("Buchungen zusammengefasst");
  }catch(e){toast("Zusammenfassen fehlgeschlagen")}
  btn.disabled=false;
}

/* ---------- QR-Aufruf ---------- */
function handleHash(){const m=/^#q-([a-z0-9]+)-([a-z0-9]+)$/.exec(location.hash||"");if(!m||!CFG)return;openSheet(m[1],m[2]);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
addEventListener("hashchange",handleHash);

/* ---------- Start: Live-Verbindung ---------- */
function setAt(path,data){const k=path.split("/").filter(Boolean);if(!k.length){MIRROR=data||{};return}let o=MIRROR;for(let n=0;n<k.length-1;n++){if(typeof o[k[n]]!=="object"||o[k[n]]===null)o[k[n]]={};o=o[k[n]]}if(data===null)delete o[k[k.length-1]];else o[k[k.length-1]]=data}
function arr(x){return Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==="object"?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]).filter(v=>v!=null):[])}
function derive(){
  const c=MIRROR.cfg;
  if(cfgDirty&&CFG){}else if(c){CFG=JSON.parse(JSON.stringify(c));CFG.items=CFG.items||{};CFG.bags=CFG.bags||{};CFG.types=CFG.types||{};
    for(const t of Object.values(CFG.types)){t.sec=arr(t.sec);for(const s of t.sec)s.l=arr(s.l)}}else CFG=null;
  BOOK=Object.entries(MIRROR.bookings||{}).map(([id,b])=>({id,...b,lines:arr(b.lines)})).sort((a,b)=>b.ts-a.ts);
  BASE=MIRROR.base||null;STATS=MIRROR.stats||{};
}
let rq=false,first=true;
function changed(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;derive();loaded.cfg=true;
  if(!CFG&&first){fb("/cfg","PUT",DEFAULT_CFG).catch(()=>toast("Startdaten konnten nicht geschrieben werden"));return}
  if(!inv)render();if(sheet)drawSheet();if(first&&CFG){first=false;handleHash()}})}
render();
if(!/^https?:\/\//.test(ROOT)){$("#sync").textContent="nicht eingerichtet";loaded.cfg=true;$("#main").innerHTML='<div class="empty"><b>Datenbank noch nicht eingetragen.</b><br>In der Datei index.html bei DB_URL die Adresse der Firebase Realtime Database eintragen.</div>'}
else{
  const es=new EventSource(ROOT+".json");
  es.addEventListener("put",e=>{const m=JSON.parse(e.data);setAt(m.path,m.data);$("#sync").textContent="live";changed()});
  es.addEventListener("patch",e=>{const m=JSON.parse(e.data);for(const k in m.data)setAt(m.path.replace(/\/$/,"")+"/"+k,m.data[k]);changed()});
  es.addEventListener("cancel",()=>{$("#sync").textContent="kein Zugriff"});
  es.onerror=()=>{$("#sync").textContent=navigator.onLine?"verbinde …":"offline"};
}
</script>
