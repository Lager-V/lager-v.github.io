function stock(){

  if(CFG)for(const b in CFG.bags)s[b]={};
  const add=(l,i,d)=>{(s[l]||(s[l]={}))[i]=((s[l]||{})[i]||0)+d};

  const skip=new Set((BASE&&BASE.incl)||[]);
  for(const b of BOOK){if(skip.has(b.id))continue;for(const x of b.lines||[])add(x.l,x.i,x.d)}
  return s;
}
function bagLines(bid){ // je Artikel Soll, sortiert nach Kategorie der ersten Fundstelle
  const b=CFG.bags[bid],t=b&&CFG.types[b.t];if(!t)return [];
  const secs=t.sec.map((s,k)=>({...s,k})).sort((a,b)=>CORD.indexOf(a.c)-CORD.indexOf(b.c)||a.k-b.k);
  const m={},out=[];
  for(const s of secs)for(const l of s.l){
    if(!CFG.items[l.i])continue;
    if(!m[l.i]){m[l.i]={i:l.i,soll:0,c:s.c,sec:s.n,parts:[]};out.push(m[l.i])}
    m[l.i].soll+=l.s;m[l.i].parts.push(s.n+" "+l.s);
  }
  return out;
}
function itemsSorted(){return Object.keys(CFG.items).sort((a,b)=>{const A=CFG.items[a],B=CFG.items[b];return CORD.indexOf(A.c)-CORD.indexOf(B.c)||A.n.localeCompare(B.n,"de")||(A.d||"").localeCompare(B.d||"","de",{numeric:true})})}

  if(rest<=mel){const need=Math.max(0,ziel-rest);if(need>0)r.push({i,need,lg,def})}}return r}

function fmtYm(ym){return MON[+ym.slice(5)-1]+" "+ym.slice(0,4)}
function chartSvg(m){
  const W=360,H=170,L=30,B=22,T=10,max=Math.max(1,...m),step=niceStep(max),top=Math.ceil(max/step)*step,bw=(W-L-6)/12;
  const y=v=>T+(H-T-B)*(1-v/top);let g="";
  const sc={0:"var(--blau)",1:"var(--blau)",11:"var(--blau)",5:"var(--warn)",6:"var(--warn)",7:"var(--warn)",2:"var(--ok)",3:"var(--ok)",4:"var(--ok)",8:"var(--rot)",9:"var(--rot)",10:"var(--rot)"};
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--mute)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  m.forEach((v,k)=>{const x=L+k*bw+3,h=(H-T-B)-(y(v)-T);g+=`<rect x="${x}" y="${y(v)}" width="${bw-6}" height="${Math.max(0,h)}" rx="2" fill="${sc[k]}" opacity="${v?0.9:0}"/><text x="${x+(bw-6)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--mute)">${MON[k]}</text>${v?`<text x="${x+(bw-6)/2}" y="${y(v)-3}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${v}</text>`:""}`});
  const leg=[["Winter","var(--blau)"],["Frühling","var(--ok)"],["Sommer","var(--warn)"],["Herbst","var(--rot)"]].map((s,k)=>`<rect x="${L+k*78}" y="${H+8}" width="10" height="10" rx="2" fill="${s[1]}"/><text x="${L+k*78+14}" y="${H+17}" font-size="13" fill="var(--ink)">${s[0]}</text>`).join("");
  return`<svg viewBox="0 0 ${W} ${H+26}" role="img" aria-label="Verbrauch je Monat">${g}${leg}</svg>`;
}
function niceStep(max){const r=max/4,p=Math.pow(10,Math.floor(Math.log10(r)));for(const f of [1,2,5,10])if(f*p>=r)return Math.max(1,f*p);return Math.max(1,p*10)}

async function book(kind){
  const q=Math.max(1,parseInt($("#sq").value)||1),l=sheet.l,i=sheet.i,who=($("#swho").value||"").trim(),note=($("#snote").value||"").trim().slice(0,300),ex=$("#sexp").value;ls("who",who);
  let lines;
  if(kind==="verbrauch"||kind==="aussort")lines=[{i,l,d:-q}];
  else if(kind==="eingang")lines=[{i,l:"lager",d:q}];
  else{const lg=stock().lager[i]||0;if(lg<q){toast(lg>0?`Im Lager sind nur ${lg} vorhanden`:"Im Lager ist nichts gebucht – erst Inventur oder Wareneingang im Lager buchen");return}lines=[{i,l:"lager",d:-q},{i,l,d:q}]}
  if(await write({kind,lines,who,note})){if(ex!==expOf(l,i))await saveExp(l,i,ex);if(kind==="auffuellen"&&hasFill(i))await saveFill(l,i,"voll");toast(`${KIND[kind]}: ${q}× ${iname(i)}`);sheet=null;drawSheet()}
}
const ROOT=(new URLSearchParams(location.search).get("db")||DB_URL).replace(/\/+$/,"")+"/sanlager";
async function fb(path,method,body){const r=await fetch(ROOT+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function write(b){
  try{await fb("/bookings","POST",{ts:Date.now(),...b});return true}
  catch(e){toast(navigator.onLine?"Buchung fehlgeschlagen, bitte erneut versuchen":"Kein Netz – Buchung nicht gespeichert");return false}
}
let saveSeq=0;
function saveSoon(){cfgDirty=true;const my=++saveSeq;clearTimeout(saveT);$("#sync").textContent="speichert …";saveT=setTimeout(async()=>{const ok=await saveCfg();if(my===saveSeq){cfgDirty=false;$("#sync").textContent=ok?"gespeichert":"live"}},600)}
function isUnl(){if(unlocked)return true;try{if(sessionStorage.getItem("sl-adm")==="1"){unlocked=true;return true}}catch(e){}return false}
function pinBox(){return`<section class="sec"><h2>Admin</h2><p class="muted" style="margin:0">Hier werden Rucksäcke, Bestückungen, Artikel und Mindestbestände bearbeitet. Buchen, Auffüllen und Inventur gehen für alle ohne Code.</p><div class="editbar"><label class="f">Admin-Code<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code"></label><button class="btn pri" data-act="unlock">Öffnen</button></div></section>`}
const COLS=[["blau","Blau"],["rot","Rot"],["gruen","Grün"],["orange","Orange"],["grau","Grau"]];
function catOpts(sel){return CORD.split("").map(c=>`<option value="${c}" ${c===sel?"selected":""}>${CLET[c]} – ${CATS[c]}</option>`).join("")}
function itemLabel(i){const it=CFG.items[i];return it.n+(it.d?" · "+it.d:"")}
function dlItems(){return`<datalist id="dl-items">${itemsSorted().map(i=>`<option value="${esc(itemLabel(i))}">`).join("")}</datalist>`}
function findOrCreate(txt,c){txt=txt.trim();if(!txt)return null;const low=txt.toLowerCase();
  for(const i in CFG.items)if(itemLabel(i).toLowerCase()===low)return i;
  const [n,...d]=txt.split("·").map(x=>x.trim());const id=newId("a",CFG.items);CFG.items[id]={n,d:d.join(" "),u:"Stk",c:c||"Z",min:0};toast(`„${txt}“ neu angelegt`);return id}
function vBagEdit(){
  const b=CFG.bags[bagSel],tid=b.t,T=CFG.types[tid],shared=Object.keys(CFG.bags).filter(x=>CFG.bags[x].t===tid&&x!==bagSel);
  let h=`<div class="row"><span class="muted small sp">Bestückung „${esc(T.n)}“${shared.length?` · gilt auch für ${shared.map(x=>esc(CFG.bags[x].n)).join(", ")}`:""}</span><button class="btn" data-act="es" data-k="bag">⚙ Rucksack</button></div><div class="list">`;
  const secs=T.sec.map((x,k)=>({...x,k})).sort((a,c)=>CORD.indexOf(a.c)-CORD.indexOf(c.c)||a.k-c.k);
  for(const sc of secs){
    h+=`<div class="shd"><span class="cl cl-${sc.c}" style="width:26px;height:26px;font-size:15px">${CLET[sc.c]}</span><span class="t">${esc(sc.n)}</span><button class="lnk" data-act="es" data-k="sec" data-s="${sc.k}">✎ Fach</button></div>`;
    sc.l.forEach((l,j)=>{const it=CFG.items[l.i];if(!it)return;h+=`<div class="eline${l.s?"":" zero"}"><button class="nmb" data-act="es" data-k="item" data-i="${l.i}"><b>${esc(it.n)}</b><i>${esc(it.d)}</i></button><span class="mini"><button data-act="lstep" data-k="${sc.k}" data-j="${j}" data-d="-1" aria-label="weniger">−</button><span>${l.s}</span><button data-act="lstep" data-k="${sc.k}" data-j="${j}" data-d="1" aria-label="mehr">+</button></span>${l.s?"":`<button class="x" data-act="ldel" data-k="${sc.k}" data-j="${j}" title="Aus Bestückung entfernen">✕</button>`}</div>`});
    h+=`<button class="lnk addl" data-act="es" data-k="add" data-s="${sc.k}">＋ Artikel in „${esc(sc.n)}“</button>`;
  }
  return h+`</div><div class="row"><button class="btn" data-act="es" data-k="sec" data-s="new">＋ Neues Fach</button></div><p class="muted small" style="margin:0">Soll mit − / + ändern. Bei 0 erscheint ✕ zum Entfernen. Artikelnamen antippen, um Bezeichnung, Grenzen oder Kategorie zu ändern.</p>`;
}
function vLagerEdit(){
  let h=`<div class="row"><input type="search" class="search sp" id="admq" placeholder="Artikel suchen …" value="${esc(admQ)}" autocomplete="off"><button class="btn pri" data-act="es" data-k="item" data-i="">＋ Neu</button></div>
   <p class="muted small" style="margin:0"><b>Meldebestand:</b> Ab hier wird nachbestellt (gezählt wird, was nach dem Auffüllen aller Rucksäcke im Lager übrig bleibt). <b>Zielbestand:</b> So viel soll nach der Bestellung da sein.</p><div class="list" id="admlist">`;
  let lastC=null;
  for(const i of itemsSorted()){const it=CFG.items[i];if(it.c!==lastC){h+=catHead(it.c);lastC=it.c}
    h+=`<div class="eline" data-q="${esc((it.n+" "+(it.d||"")).toLowerCase())}"><button class="nmb" data-act="es" data-k="item" data-i="${i}"><b>${esc(it.n)}</b><i>${esc(it.d)}</i><small>Melde ${it.min||0} · Ziel ${it.ziel?it.ziel:"–"} · ${esc(it.u)}</small></button><span class="lnk">›</span></div>`}
  return h+`</div>`;
}
function filterAdm(){const q=admQ.trim().toLowerCase(),el=$("#admlist");if(!el)return;let cur=null,any=false;
  [...el.children].forEach(c=>{if(c.classList.contains("cat")){if(cur)cur.hidden=!any;cur=c;any=false;return}const ok=!q||c.dataset.q.includes(q);c.hidden=!ok;if(ok)any=true});if(cur)cur.hidden=!any}
function stepRow(f,lab,sub,v){return`<div class="stp"><span class="lb"><b>${lab}</b><small>${sub}</small></span><span class="mini"><button data-act="fstep" data-f="${f}" data-d="-1" aria-label="weniger">−</button><input type="number" inputmode="numeric" min="0" data-sf="${f}" value="${v}" aria-label="${lab}" style="width:64px;border:0;text-align:center;font-family:var(--f-num);font-size:17px;min-height:40px"><button data-act="fstep" data-f="${f}" data-d="1" aria-label="mehr">+</button></span></div>`}
function sureBtn(act,txt){return`<button class="btn dng" data-act="${act}">${txt}</button>`}

  if(sh.kind==="bag"){const b=CFG.bags[bagSel],T=CFG.types[b.t],shared=Object.keys(CFG.bags).filter(x=>CFG.bags[x].t===b.t&&x!==bagSel);
    return`<div class="row"><b class="sp sht">Rucksack</b>${close}</div>
    <label class="f">Name<input data-sf="n" value="${esc(t.n)}"></label>
    <div class="chips">${COLS.map(([c,n])=>`<button class="chip" data-act="tcol" data-c="${c}" aria-pressed="${t.col===c}"><span class="dot d-${c}"></span>${n}</button>`).join("")}</div>
    <label class="f">Bestückung<select data-sf="t">${Object.keys(CFG.types).map(x=>`<option value="${x}" ${x===t.t?"selected":""}>${esc(CFG.types[x].n)}</option>`).join("")}</select></label>
    ${shared.length?`<p class="note" style="margin:0">Gleiche Bestückung wie ${shared.map(x=>esc(CFG.bags[x].n)).join(", ")}. Änderungen am Soll gelten für alle. <button class="btn small" data-act="bagown">Eigene Bestückung anlegen</button></p>`:""}

function openEdit(k,d){
  $("#sheet").innerHTML="";
  if(k==="item"){const it=d.i?CFG.items[d.i]:{n:"",d:"",u:"Stk",c:"C",min:0,ziel:0};sheet={kind:"item",i:d.i||null,tmp:{n:it.n,d:it.d||"",u:it.u||"Stk",c:it.c||"C",min:it.min||0,ziel:it.ziel||it.min||0,fill:d.i?hasFill(d.i):false}}}
  else if(k==="sec"){const T=CFG.types[CFG.bags[bagSel].t],x=d.s==="new"?{n:"",c:"E"}:T.sec[+d.s];sheet={kind:"sec",s:d.s,tmp:{n:x.n,c:x.c}}}
  else if(k==="add")sheet={kind:"add",tmp:{q:"",s:d.s,soll:1}};
  else if(k==="bag"){const b=CFG.bags[bagSel];sheet={kind:"bag",tmp:{n:b.n,t:b.t,col:CFG.types[b.t].col||"rot"}}}
  drawSheet();
}
async function saveCfg(msg){
  try{await fb("/cfg","PUT",CFG);if(msg)toast(msg);return true}
  catch(e){toast("Speichern fehlgeschlagen");return false}
}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sanlager:"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function newId(pre,obj){let n=1;while(obj[pre+String(n).padStart(2,"0")])n++;return pre+String(n).padStart(2,"0")}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;inv=null;edit=null;render();scrollTo(0,0);return}
  const a=t.dataset.act,S=()=>stock();
  if(t.tagName==="SELECT")return;
  if(a==="openbag"){bagSel=t.dataset.b;tab="bags";render();scrollTo(0,0)}
  else if(a==="selbag"){bagSel=t.dataset.b;inv=null;render()}
  else if(a==="sheet")openSheet(t.dataset.l,t.dataset.i);
  else if(a==="close"||(t.id==="sheet")){sheet=null;drawSheet()}
  else if(a==="sloc"){const e=$("#sexp");if(e)e.remove();keepSheet();sheet.exp=undefined;sheet.l=t.dataset.l;drawSheet()}
  else if(a==="qm"||a==="qp"){sheet.q=Math.max(1,(parseInt($("#sq").value)||1)+(a==="qp"?1:-1));$("#sq").value=sheet.q}
  else if(a==="qfill"){keepSheet();const st=S(),so=(bagLines(sheet.l).find(x=>x.i===sheet.i)||{}).soll||0;sheet.q=Math.max(1,so-((st[sheet.l]||{})[sheet.i]||0));$("#sq").value=sheet.q}
  else if(a==="book"){t.disabled=true;await book(t.dataset.k);t.disabled=false}
  else if(a==="fillall"){const st=S(),lines=[];for(const x of bagLines(bagSel)){const need=x.soll-((st[bagSel]||{})[x.i]||0),av=Math.max(0,st.lager[x.i]||0),q=Math.min(need,av);if(q>0)lines.push({i:x.i,l:"lager",d:-q},{i:x.i,l:bagSel,d:q})}
    if(!lines.length){toast("Im Lager ist nichts davon vorrätig");return}
    t.disabled=true;if(await write({kind:"auffuellen",lines,who:ls("who")||""}))toast(`${lines.length/2} Artikel aufgefüllt`);t.disabled=false}
  else if(a==="invstart"){inv={l:t.dataset.l,v:{}};render()}
  else if(a==="invcancel"){inv=null;render()}
  else if(a==="invsave"){const st=S(),lines=[];document.querySelectorAll("[data-inv]").forEach(x=>{const i=x.dataset.inv,v=parseInt(x.value);if(isNaN(v))return;const d=v-((st[inv.l]||{})[i]||0);if(d)lines.push({i,l:inv.l,d})});
    if(!lines.length){inv=null;render();toast("Keine Abweichungen");return}
    if(await write({kind:"inventur",lines,who:ls("who")||""})){toast(`Inventur gebucht: ${lines.length} Abweichungen`);inv=null;render()}}
  else if(a==="storno"){if(t.dataset.sure){try{await fb("/bookings/"+t.dataset.id,"DELETE");toast("Buchung storniert")}catch(err){toast("Storno nicht möglich")}}else{t.dataset.sure=1;t.textContent="Wirklich?"}}
  else if(a==="additem"){const n=$("#na-n").value.trim();if(!n){toast("Bitte eine Bezeichnung eingeben");return}
    const id=newId("a",CFG.items),c=$("#na-c").value;CFG.items[id]={n,d:$("#na-d").value.trim(),u:$("#na-u").value,c,min:parseInt($("#na-min").value)||0};
    const tt=$("#na-t").value,so=parseInt($("#na-soll").value)||0;
    if(tt&&so>0){const T=CFG.types[tt];let s=$("#na-s").value!==""?T.sec[+$("#na-s").value]:T.sec.find(x=>x.c===c);if(!s){s={n:CATS[c],c,l:[]};T.sec.push(s)}s.l.push({i:id,s:so})}
    if(await saveCfg(`„${n}“ angelegt`))render()}
  else if(a==="delitem"){if(t.dataset.sure){const i=t.dataset.i;delete CFG.items[i];for(const T of Object.values(CFG.types))for(const s of T.sec)s.l=s.l.filter(l=>l.i!==i);await saveCfg("Artikel gelöscht");render()}else{t.dataset.sure=1;t.textContent="Wirklich?"}}
  else if(a==="seltype"){editType=t.dataset.t;render()}
  else if(a==="delline"){CFG.types[editType].sec[+t.dataset.k].l.splice(+t.dataset.j,1);await saveCfg("Entfernt");render()}
  else if(a==="addline"){const k=+t.dataset.k,i=$("#al-"+k).value,s=parseInt($("#as-"+k).value)||1;if(!i)return;CFG.types[editType].sec[k].l.push({i,s});await saveCfg("Hinzugefügt");render()}
  else if(a==="addbag"){const n=$("#nb-n").value.trim();if(!n){toast("Bitte einen Namen eingeben");return}const id=newId("b",CFG.bags);CFG.bags[id]={n,t:$("#nb-t").value};await saveCfg(`${n} angelegt`);render()}
  else if(a==="delbag"){if(t.dataset.sure){delete CFG.bags[t.dataset.b];await saveCfg("Rucksack gelöscht");render()}else{t.dataset.sure=1;t.textContent="Wirklich?"}}
  else if(a==="unlock"){if($("#pin").value.trim()===ADMIN_CODE){unlocked=true;try{sessionStorage.setItem("sl-adm","1")}catch(e){}render()}else toast("Code falsch")}
  else if(a==="lock"){unlocked=false;try{sessionStorage.removeItem("sl-adm")}catch(e){}tab="home";render()}
  else if(a==="adm"){adm=t.dataset.v;render();scrollTo(0,0)}
  else if(a==="labdl")saveLabels();
  else if(a==="es")openEdit(t.dataset.k,t.dataset);
  else if(a==="mailsave"){const raw=$("#mail-an").value.split(/[\s,;]+/).filter(Boolean),bad=raw.filter(x=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));if(bad.length){toast("Keine gültige Adresse: "+bad[0]);return}CFG.mail={an:raw.join(","),best:$("#mail-best").checked,exp:$("#mail-exp").checked,fill:$("#mail-fill").checked};saveSoon();toast(raw.length?raw.length+" Empfänger gespeichert":"Gespeichert – ohne Adresse werden keine Mails verschickt")}
  else if(a==="fstep"){keepSheet();const f=t.dataset.f;sheet.tmp[f]=Math.max(f==="soll"?1:0,(+sheet.tmp[f]||0)+ +t.dataset.d);drawSheet()}
  else if(a==="tcol"){keepSheet();sheet.tmp.col=t.dataset.c;drawSheet()}
  else if(a==="itemsave"){keepSheet();const m=sheet.tmp;if(!m.n.trim()){toast("Bitte eine Bezeichnung eingeben");return}const id=sheet.i||newId("a",CFG.items);CFG.items[id]={...(CFG.items[id]||{}),n:m.n.trim(),d:m.d.trim(),u:m.u.trim()||"Stk",c:m.c,min:+m.min||0,ziel:+m.ziel||0,fill:!!m.fill};sheet=null;drawSheet();saveSoon();toast("Gespeichert");render()}
  else if(a==="itemdel1"||a==="secdel1"||a==="bagdel1"){keepSheet();sheet.sure=1;drawSheet()}
  else if(a==="itemdel2"){const i=sheet.i;delete CFG.items[i];for(const T of Object.values(CFG.types))for(const sc of T.sec)sc.l=sc.l.filter(l=>l.i!==i);sheet=null;drawSheet();saveSoon();toast("Artikel gelöscht");render()}
  else if(a==="secsave"){keepSheet();const m=sheet.tmp,T=CFG.types[CFG.bags[bagSel].t];if(!m.n.trim()){toast("Bitte einen Namen eingeben");return}if(sheet.s==="new")T.sec.push({n:m.n.trim(),c:m.c,l:[]});else Object.assign(T.sec[+sheet.s],{n:m.n.trim(),c:m.c});sheet=null;drawSheet();saveSoon();render()}
  else if(a==="secdel2"){CFG.types[CFG.bags[bagSel].t].sec.splice(+sheet.s,1);sheet=null;drawSheet();saveSoon();toast("Fach gelöscht");render()}
  else if(a==="addsave"){keepSheet();const m=sheet.tmp,T=CFG.types[CFG.bags[bagSel].t],sc=T.sec[+m.s],id=findOrCreate(m.q,sc.c);if(!id){toast("Bitte einen Artikel eingeben");return}const ex=sc.l.find(l=>l.i===id);if(ex)ex.s+=+m.soll;else sc.l.push({i:id,s:+m.soll});sheet=null;drawSheet();saveSoon();render()}
  else if(a==="bagsave"){keepSheet();const m=sheet.tmp,b=CFG.bags[bagSel];b.n=m.n.trim()||b.n;b.t=m.t;CFG.types[b.t].col=m.col;sheet=null;drawSheet();saveSoon();toast("Gespeichert");render()}
  else if(a==="bagdel2"){delete CFG.bags[bagSel];bagSel=null;sheet=null;drawSheet();saveSoon();toast("Rucksack gelöscht");render()}
  else if(a==="expsave"){const v=$("#sexp").value;if(await saveExp(sheet.l,sheet.i,v)){sheet.exp=undefined;toast(v?"Verfall gespeichert":"Datum entfernt");drawSheet()}}
  else if(a==="fillset"){const v=t.dataset.v,who=($("#swho")||{}).value;if(who!==undefined)ls("who",who.trim());if(await saveFill(sheet.l,sheet.i,v)){toast("Füllung: "+FST.find(x=>x[0]===v)[1]);keepSheet();drawSheet()}}
  else if(a==="tfill"){keepSheet();sheet.tmp.fill=!sheet.tmp.fill;drawSheet()}
  else if(a==="expclr"){if(await saveExp(sheet.l,sheet.i,"")){sheet.exp="";toast("Datum entfernt");drawSheet()}}
  else if(a==="editon"){edit=t.dataset.m;inv=null;render()}
  else if(a==="editoff"){edit=null;render()}
  else if(a==="lstep"){const T=CFG.types[CFG.bags[bagSel].t],l=T.sec[+t.dataset.k].l[+t.dataset.j];l.s=Math.max(0,l.s+ +t.dataset.d);saveSoon();render()}
  else if(a==="ldel"){CFG.types[CFG.bags[bagSel].t].sec[+t.dataset.k].l.splice(+t.dataset.j,1);saveSoon();render()}
  else if(a==="ladd"){const k=+t.dataset.k,T=CFG.types[CFG.bags[bagSel].t],inp=$("#la-"+k),id=findOrCreate(inp.value,T.sec[k].c);if(!id)return;const ex=T.sec[k].l.find(l=>l.i===id);if(ex)ex.s++;else T.sec[k].l.push({i:id,s:1});saveSoon();render()}
  else if(a==="secdel"){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Fach löschen?";return}CFG.types[CFG.bags[bagSel].t].sec.splice(+t.dataset.k,1);saveSoon();render()}
  else if(a==="addsec"){const n=$("#nf-n").value.trim();if(!n)return;CFG.types[CFG.bags[bagSel].t].sec.push({n,c:$("#nf-c").value,l:[]});saveSoon();render()}
  else if(a==="bagcol"){CFG.types[CFG.bags[bagSel].t].col=t.dataset.c;saveSoon();render()}
  else if(a==="bagown"){const b=CFG.bags[bagSel],id=newId("t",CFG.types);CFG.types[id]=JSON.parse(JSON.stringify(CFG.types[b.t]));CFG.types[id].n=b.n;b.t=id;sheet=null;drawSheet();saveSoon();toast("Eigene Bestückung angelegt");render()}
  else if(a==="bagdup"){const b=CFG.bags[bagSel],id=newId("b",CFG.bags),tid=newId("t",CFG.types);CFG.types[tid]=JSON.parse(JSON.stringify(CFG.types[b.t]));CFG.types[tid].n=b.n+" (Kopie)";CFG.bags[id]={n:b.n+" (Kopie)",t:tid};bagSel=id;sheet=null;drawSheet();saveSoon();toast("Rucksack dupliziert");render()}
  else if(a==="bagnew"){const id=newId("b",CFG.bags),tid=newId("t",CFG.types);CFG.types[tid]={n:"Neuer Rucksack",col:"rot",sec:[{n:"Hygiene",c:"H",l:[]}]};CFG.bags[id]={n:"Neuer Rucksack",t:tid};bagSel=id;adm="bags";tab="admin";saveSoon();render()}
  else if(a==="bagdel"){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Rucksack löschen?";return}delete CFG.bags[bagSel];bagSel=null;edit=null;saveSoon();toast("Rucksack gelöscht");render()}
  else if(a==="minstep"){const it=CFG.items[t.dataset.i];it.min=Math.max(0,(it.min||0)+ +t.dataset.d);saveSoon();render()}
  else if(a==="itemdel"){if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Löschen?";return}const i=t.dataset.i;delete CFG.items[i];for(const T of Object.values(CFG.types))for(const sc of T.sec)sc.l=sc.l.filter(l=>l.i!==i);saveSoon();render()}
  else if(a==="itemnew"){const n=$("#ni-n").value.trim();if(!n){toast("Bitte eine Bezeichnung eingeben");return}const id=newId("a",CFG.items);CFG.items[id]={n,d:$("#ni-d").value.trim(),u:$("#ni-u").value,c:$("#ni-c").value,min:0};saveSoon();toast(`„${n}“ angelegt`);render()}
  else if(a==="compact")compact(t);
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="statsel"){statItem=t.value;render()}
  else if(t.id==="labsel"){labLoc=t.value;drawLabels()}
  else if(t.id==="na-t"){const T=CFG.types[t.value];$("#na-s").innerHTML='<option value="">automatisch nach Kategorie</option>'+(T?T.sec.map((s,k)=>`<option value="${k}">${CLET[s.c]} · ${esc(s.n)}</option>`).join(""):"")}
  else if(t.id==="eb-name"){CFG.bags[bagSel].n=t.value.trim()||CFG.bags[bagSel].n;saveSoon();render()}
  else if(t.id==="eb-type"){CFG.bags[bagSel].t=t.value;saveSoon();render()}
  else if(t.dataset.secname!==undefined){const sc=CFG.types[CFG.bags[bagSel].t].sec[+t.dataset.secname];sc.n=t.value.trim()||sc.n;saveSoon()}
  else if(t.dataset.seccat!==undefined){CFG.types[CFG.bags[bagSel].t].sec[+t.dataset.seccat].c=t.value;saveSoon();render()}
  else if(t.dataset.it){const it=CFG.items[t.dataset.it];it[t.dataset.f]=t.value.trim();saveSoon();if(t.dataset.f==="c")render()}
  else if(t.dataset.ed){const it=CFG.items[t.dataset.ed],f=t.dataset.f;it[f]=f==="min"?(parseInt(t.value)||0):t.value.trim();await saveCfg("Gespeichert")}
  else if(t.dataset.soll!==undefined){CFG.types[editType].sec[+t.dataset.soll].l[+t.dataset.j].s=Math.max(0,parseInt(t.value)||0);await saveCfg("Soll gespeichert")}
  else if(t.dataset.bag){CFG.bags[t.dataset.bag].n=t.value.trim()||CFG.bags[t.dataset.bag].n;await saveCfg("Gespeichert")}
});
document.addEventListener("input",e=>{if(e.target.id==="admq"){admQ=e.target.value;filterAdm()}});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.id&&t.id.startsWith("la-")){e.preventDefault();document.querySelector(`[data-act=ladd][data-k="${t.id.slice(3)}"]`).click()}});
document.addEventListener("toggle",e=>{const d=e.target;if(!d.id)return;if(d.open)OPEN.add(d.id);else OPEN.delete(d.id);if(d.id==="labdet"){ls("labopen",d.open?"1":"");drawLabels()}},true);
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet"){sheet=null;drawSheet()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;drawSheet()}});

/* ---------- Etiketten-Datei ---------- */
function saveLabels(){
  if(!window.QRCode){toast("QR-Bibliothek nicht geladen");return}
  const cells=[];for(const i of labelItems()){const it=CFG.items[i],tmp=document.createElement("div");new QRCode(tmp,{text:qrUrl(labLoc,i),width:300,height:300,correctLevel:QRCode.CorrectLevel.M});const c=tmp.querySelector("canvas");
    cells.push(`<div class="l"><img src="${c.toDataURL()}" alt=""><b>${esc(it.n)}</b><span>${esc(it.d)}</span><small>${esc(locName(labLoc))} · ${CLET[it.c]} ${CATS[it.c]}</small></div>`)}
  $("#print").innerHTML=`<div class="g">${cells.join("")}</div>`;setTimeout(()=>window.print(),150);
}

/* ---------- Zusammenfassen ---------- */
async function compact(btn){
  if(!btn.dataset.sure){btn.dataset.sure=1;btn.textContent="Wirklich zusammenfassen?";return}
  btn.disabled=true;
  try{
    const st=stock(),p={base:{stock:st,at:Date.now()}},add={};
    for(const b of BOOK){p["bookings/"+b.id]=null;if(b.kind!=="verbrauch")continue;const d=new Date(b.ts),ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");for(const x of b.lines)if(x.d<0){(add[ym]||(add[ym]={}))[x.i]=((add[ym]||{})[x.i]||0)-x.d}}
    for(const ym in add){const c={...((STATS[ym]||{}).c||{})};for(const i in add[ym])c[i]=(c[i]||0)+add[ym][i];p["stats/"+ym]={c}}
    await fb("","PATCH",p);toast("Buchungen zusammengefasst");
  }catch(e){toast("Zusammenfassen fehlgeschlagen")}
  btn.disabled=false;
}

/* ---------- QR-Aufruf ---------- */
function handleHash(){if(location.hash==="#admin"){tab="admin";render();return}const m=/^#q-([a-z0-9]+)-([a-z0-9]+)$/.exec(location.hash||"");if(!m||!CFG)return;openSheet(m[1],m[2]);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}
addEventListener("hashchange",handleHash);

/* ---------- Start: Live-Verbindung ---------- */
function setAt(path,data){const k=path.split("/").filter(Boolean);if(!k.length){MIRROR=data||{};return}let o=MIRROR;for(let n=0;n<k.length-1;n++){if(typeof o[k[n]]!=="object"||o[k[n]]===null)o[k[n]]={};o=o[k[n]]}if(data===null)delete o[k[k.length-1]];else o[k[k.length-1]]=data}
function arr(x){return Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==="object"?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]).filter(v=>v!=null):[])}
function derive(){
  const c=MIRROR.cfg;
  if(cfgDirty&&CFG){}else if(c){CFG=JSON.parse(JSON.stringify(c));CFG.items=CFG.items||{};CFG.bags=CFG.bags||{};CFG.types=CFG.types||{};
    for(const t of Object.values(CFG.types)){t.sec=arr(t.sec);for(const s of t.sec)s.l=arr(s.l)}}else CFG=null;
  BOOK=Object.entries(MIRROR.bookings||{}).map(([id,b])=>({id,...b,lines:arr(b.lines)})).sort((a,b)=>b.ts-a.ts);
  BASE=MIRROR.base||null;STATS=MIRROR.stats||{};EXP=MIRROR.exp||{};FILL=MIRROR.fill||{};
}
let rq=false,first=true;
function changed(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;derive();loaded.cfg=true;
  if(!CFG&&first){fb("/cfg","PUT",DEFAULT_CFG).catch(()=>toast("Startdaten konnten nicht geschrieben werden"));return}
  if(!inv||!didMain)render();if(sheet&&!sheet.kind&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#sheet"))){keepSheet();drawSheet()}if(first&&CFG){first=false;handleHash()}})}
function saveView(){try{sessionStorage.setItem("sl-view",JSON.stringify({tab,adm,bagSel,labLoc,inv}))}catch(e){}}
(function(){try{const v=JSON.parse(sessionStorage.getItem("sl-view")||"null");if(v){tab=v.tab||tab;adm=v.adm||adm;bagSel=v.bagSel||null;labLoc=v.labLoc||labLoc;inv=v.inv||null}}catch(e){}})();
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.inv&&inv){inv.v[t.dataset.inv]=t.value;saveView()}});
addEventListener("pagehide",saveView);document.addEventListener("visibilitychange",()=>{if(document.hidden)saveView()});
render();
if(!/^https?:\/\//.test(ROOT)){$("#sync").textContent="nicht eingerichtet";loaded.cfg=true;$("#main").innerHTML='<div class="empty"><b>Datenbank noch nicht eingetragen.</b><br>In der Datei index.html bei DB_URL die Adresse der Firebase Realtime Database eintragen.</div>'}
else{
  const es=new EventSource(ROOT+".json");
  es.addEventListener("put",e=>{const m=JSON.parse(e.data);setAt(m.path,m.data);$("#sync").textContent="live";changed()});
  es.addEventListener("patch",e=>{const m=JSON.parse(e.data);for(const k in m.data)setAt(m.path.replace(/\/$/,"")+"/"+k,m.data[k]);changed()});
  es.addEventListener("cancel",()=>{$("#sync").textContent="kein Zugriff"});
  es.onerror=()=>{$("#sync").textContent=navigator.onLine?"verbinde …":"offline"};
}
